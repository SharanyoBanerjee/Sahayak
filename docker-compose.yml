services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayak-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-secret-key-sahayak-prototype-2026
      - DJANGO_ALLOWED_HOSTS=*
      - POSTGRES_DB=sahayak
      - POSTGRES_USER=sahayak_user
      - POSTGRES_PASSWORD=sahayak_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/../data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahayak-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: sahayak-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sahayak
      - POSTGRES_USER=sahayak_user
      - POSTGRES_PASSWORD=sahayak_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak_user -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
